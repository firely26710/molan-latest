name: sync-molan-latest
on:
  schedule:
    # 每天 UTC 01:23 跑一次（北京时间 09:23），避开整点高峰
    - cron: '23 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-molan
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查并同步最新版
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/baiji6/molanyinyueyuan/releases/latest"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "User-Agent: molan-sync")
          META=$(curl -fsSL "${AUTH[@]}" -H "Accept: application/vnd.github+json" "$API")
          TAG=$(echo "$META" | jq -r '.tag_name')
          ASSET_URL=$(echo "$META" | jq -r '[.assets[] | select(.name | endswith(".js"))][0].url // empty')
          test -n "$ASSET_URL" || { echo "未找到 js 资产"; exit 1; }
          curl -fsSL "${AUTH[@]}" -H "Accept: application/octet-stream" "$ASSET_URL" -o latest.js
          head -c 400 latest.js | grep -q '/\*!' || { echo "内容不像音源脚本"; exit 1; }
          SZ=$(stat -c%s latest.js)
          test "$SZ" -gt 100000 || { echo "文件过小：$SZ"; exit 1; }
          echo "检查完成：tag=$TAG size=$SZ"
          git config user.name  'molan-sync[bot]'
          git config user.email 'molan-sync[bot]@users.noreply.github.com'
          git add latest.js
          if git diff --cached --quiet; then
            # 无新版也推一条空提交，给仓库保活，避免 60 天后定时被自动停用
            git commit --allow-empty -m "daily check $TAG (no update)"
            echo "无新版，已推送保活空提交"
          else
            git commit -m "sync $TAG"
            echo "已同步 $TAG"
          fi
          git push
